<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joke-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 90%;
        }

        .joke-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            color: white;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.6;
            font-weight: 500;
        }

        .joke-content {
            display: none;
        }

        .joke-content.active {
            display: block;
        }

        .punchline {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        .loading {
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .joke-type {
            display: inline-block;
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            padding: 15px;
            background: #fadbd8;
            border-radius: 10px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .joke-counter {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="joke-container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh-out-loud joke every time!</p>

        <div class="joke-box">
            <div class="loading active">
                <div class="spinner"></div>
            </div>
            <div class="joke-content" id="jokeContent">
                <div class="joke-type" id="jokeType"></div>
                <div id="setup"></div>
                <div class="punchline" id="delivery"></div>
            </div>
        </div>

        <div class="error" id="errorBox"></div>

        <button onclick="getJoke()">
            <i class="fas fa-laugh-beam"></i> Get Another Joke
        </button>

        <div class="joke-counter">
            <span id="jokeCount">0</span> jokes loaded
        </div>
    </div>

    <script>
        let jokeCount = 0;

        async function getJoke() {
            const jokeBox = document.querySelector('.joke-box');
            const loading = document.querySelector('.loading');
            const jokeContent = document.querySelector('.joke-content');
            const errorBox = document.getElementById('errorBox');

            // Reset states
            loading.classList.add('active');
            jokeContent.classList.remove('active');
            errorBox.classList.remove('active');

            try {
                // Fetch from JokeAPI
                const response = await fetch('https://v2.jokeapi.dev/joke/Any?format=json');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                // Handle the response
                if (data.error) {
                    throw new Error('No joke available');
                }

                // Display joke based on type
                if (data.type === 'single') {
                    document.getElementById('setup').innerHTML = data.joke;
                    document.getElementById('delivery').innerHTML = '';
                } else if (data.type === 'twopart') {
                    document.getElementById('setup').innerHTML = data.setup;
                    document.getElementById('delivery').innerHTML = data.delivery;
                }

                // Display joke category
                const category = data.category || 'General';
                document.getElementById('jokeType').textContent = category;

                // Update counter
                jokeCount++;
                document.getElementById('jokeCount').textContent = jokeCount;

                // Show joke content
                loading.classList.remove('active');
                jokeContent.classList.add('active');

            } catch (error) {
                loading.classList.remove('active');
                errorBox.classList.add('active');
                errorBox.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${error.message}. Please try again.`;
                console.error('Error:', error);
            }
        }

        // Load a joke on page load
        window.addEventListener('load', getJoke);
    </script>
</body>
</html>
